<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>展示と校舎 | 第80回麻布学園文化祭</title>
<meta name="description" content="校舎の3Dモデルから展示を探し、展示から展示への最短経路を調べられます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=22">
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>
</head>
<body class="p-map">

<p class="demo-note">第80回文化祭実行委員長選挙のためのデモです。公式サイトではありません。</p>

<header class="bar">
  <a class="mark disp" href="index.html"><span class="mark-n">80th</span> Afes demo site</a>
  <button class="burger" aria-expanded="false" aria-controls="nav" aria-label="メニューを開く">
    <span></span><span></span><span></span>
  </button>
  <nav id="nav">
    <a href="map.html" aria-current="page">展示と校舎</a>
    <a href="goods.html">物販</a>
    <a href="access.html">行き方</a>
  </nav>
</header>

<main>
  <section id="map">
    <canvas id="stage"></canvas>

    <h1 class="title">
      <span class="modes" role="tablist" aria-label="表示の切り替え">
        <button class="en disp on" data-mode="exhibit" role="tab" aria-selected="true">EXHIBITIONS</button>
        <button class="en disp" data-mode="stage" role="tab" aria-selected="false">STAGE</button>
      </span>
      <small id="sub">展示と校舎　普通教室棟と講堂、展示96件</small>
    </h1>

    <aside class="panel card" id="panel" data-open="true">
      <button class="panel-toggle" aria-expanded="true">展示一覧</button>
      <div class="panel-body">
        <input id="q" type="search" placeholder="部屋番号か展示名で絞る" aria-label="展示を絞り込む">
        <ol id="list"></ol>
      </div>
    </aside>

    <aside class="panel card tt" id="tt" data-open="true" hidden>
      <button class="panel-toggle" aria-expanded="true">タイムテーブル</button>
      <div class="panel-body">
        <div class="days" role="group" aria-label="日を選ぶ">
          <button data-day="1" class="on">1日目</button>
          <button data-day="2">2日目</button>
          <button data-day="3">3日目</button>
        </div>
        <div class="grid" id="grid"></div>
      </div>
    </aside>

    <div id="slot" aria-live="polite" hidden></div>

    <div class="floors" role="group" aria-label="階を選ぶ">
      <button data-floor="0" class="on">全階</button>
      <button data-floor="1">1F</button>
      <button data-floor="2">2F</button>
      <button data-floor="3">3F</button>
      <button data-floor="4">4F</button>
    </div>

    <p class="hint" id="hint">一覧か3Dの部屋を押すと説明を見られます。黄色は階段とエレベーター</p>
  </section>
</main>

<dialog id="sheet" aria-label="展示の詳細"></dialog>

<script type="module" src="site.js?v=22"></script>
<script type="module" src="app.js?v=22"></script>
</body>
</html>
